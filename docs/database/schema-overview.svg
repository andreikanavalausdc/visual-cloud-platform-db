<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="980" viewBox="0 0 1950 980">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="60" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#0f172a" font-weight="700">Visual Cloud Platform | PostgreSQL OLTP</text>
<text x="60" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#334155" font-weight="400">24 tables / 33 foreign keys / 4 views</text>
<rect x="60" y="160" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="160" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="82" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">01  OWNERSHIP</text>
<text x="82" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">users</text>
<text x="82" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">user_credentials  [optional 1:1]</text>
<text x="82" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">workflows</text>
<text x="82" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Account owns reusable processes.</text>
<text x="82" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Private credentials use a separate table.</text>
<rect x="530" y="160" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="530" y="160" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="552" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">02  SAVED GRAPH</text>
<text x="552" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">workflow_versions</text>
<text x="552" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">workflow_nodes / workflow_edges</text>
<text x="552" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">operation_versions</text>
<text x="552" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">One version contains nodes and edges.</text>
<text x="552" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Published graphs are immutable.</text>
<rect x="1000" y="160" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="1000" y="160" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="1022" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">03  LAUNCH</text>
<text x="1022" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">workflow_runs</text>
<text x="1022" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">node_executions</text>
<text x="1022" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">run_results</text>
<text x="1022" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Run references one exact saved version.</text>
<text x="1022" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Node execution is separate from retries.</text>
<rect x="1470" y="160" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="1470" y="160" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="1492" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">04  ATTEMPT</text>
<text x="1492" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">task_attempts</text>
<text x="1492" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">task_artifacts</text>
<text x="1492" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">task_measurements</text>
<text x="1492" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Each attempt has a sealed decision.</text>
<text x="1492" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Files and terminal telemetry are linked.</text>
<rect x="60" y="560" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="560" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="82" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">05  FILE METADATA</text>
<text x="82" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">artifacts</text>
<text x="82" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Owned references, checksum, size, expiry.</text>
<text x="82" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">File bodies stay outside PostgreSQL.</text>
<text x="82" y="796" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">A missing file does not erase run history.</text>
<rect x="530" y="560" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="530" y="560" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="552" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">06  FROZEN CONFIGURATION</text>
<text x="552" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">runtime_configurations</text>
<text x="552" y="669" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">selection_policy_versions</text>
<text x="552" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">cost_model_versions</text>
<text x="552" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Environment, policy and rates are versioned.</text>
<text x="552" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Configured resources differ from utilization.</text>
<rect x="1000" y="560" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="1000" y="560" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="1022" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">07  AUDITABLE CHOICE</text>
<text x="1022" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">selection_decisions</text>
<text x="1022" y="669" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">decision_candidates</text>
<text x="1022" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">candidate_evidence_links</text>
<text x="1022" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Candidate eligibility, estimates, exclusions.</text>
<text x="1022" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Only earlier calibration is usable evidence.</text>
<rect x="1470" y="560" width="420" height="250" rx="15" fill="white" stroke="#cbd5e1"/>
<rect x="1470" y="560" width="420" height="8" rx="4" fill="#2563eb"/>
<text x="1492" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">08  RESEARCH</text>
<text x="1492" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">experiment_conditions</text>
<text x="1492" y="669" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">run_measurements</text>
<text x="1492" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#0f172a" font-weight="700">run_verifications</text>
<text x="1492" y="748" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Condition, repetition and correctness differ.</text>
<text x="1492" y="772" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Failed and incomplete cases stay visible.</text>
