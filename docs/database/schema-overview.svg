<path d="M 1470 685 L 1420 685" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1830 560 L 1830 455 L 1400 455 L 1400 410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1485" y="441" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526177" font-weight="400">optional research condition</text>
<text x="60" y="872" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700">Core flow: save a version → accept a launch → record a decision → dispatch an attempt → bind results and evidence</text>
<text x="60" y="916" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#334155" font-weight="400">schema_migrations stores structural history. Full fields, exact cardinalities and every FK: data-dictionary.md / logical-schema.mmd.</text>
<text x="60" y="948" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#92400e" font-weight="400">All supplied runs, forecasts, rates and measurements are synthetic fixtures. No AWS experiment or processor execution is claimed.</text>
