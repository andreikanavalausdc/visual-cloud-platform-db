<text x="595" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526177" font-weight="400">owned input / output references</text>
<path d="M 1210 560 L 1210 525 L 1680 525 L 1680 410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1428" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#526177" font-weight="400">sealed choice before dispatch</text>
